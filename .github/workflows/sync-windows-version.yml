name: Sync Windows version branch

on:
  push:
    branches:
      - codex/world-tour-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-windows-version
  cancel-in-progress: false

env:
  CANONICAL_BRANCH: codex/world-tour-v1
  WINDOWS_BRANCH: codex/windows-version
  RELEASE_VERSION: 0.8.0

jobs:
  sync:
    if: github.repository == 'raoniai/groovebound-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the Windows branch
        uses: actions/checkout@v4
        with:
          ref: codex/windows-version
          fetch-depth: 0

      - name: Merge the latest canonical source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            "+refs/heads/${CANONICAL_BRANCH}:refs/remotes/origin/${CANONICAL_BRANCH}" \
            "+refs/heads/${WINDOWS_BRANCH}:refs/remotes/origin/${WINDOWS_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "origin/${CANONICAL_BRANCH}"

      - name: Install regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit lua-check love xvfb

      - name: Verify merged source
        working-directory: groove-bound
        run: |
          make test
          make lint
          xvfb-run -a env GROOVE_BOUND_SMOKE=1 love .

      - name: Audit desktop portability
        run: |
          python3 skills/groove-bound-desktop-distribution/scripts/portability_audit.py --root .
          git diff --check "origin/${WINDOWS_BRANCH}..HEAD"

      - name: Push the synchronized Windows branch
        run: git push origin "HEAD:${WINDOWS_BRANCH}"

  package-common:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out canonical source
        uses: actions/checkout@v4
        with:
          ref: codex/world-tour-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and verify the common payload once
        working-directory: groove-bound
        run: |
          python scripts/package_love.py --version "$RELEASE_VERSION" --require-clean
          python scripts/verify_release_package.py dist/groove-bound.love

      - name: Upload common payload
        uses: actions/upload-artifact@v4
        with:
          name: Groove-Bound-common
          path: groove-bound/dist/groove-bound.love
          if-no-files-found: error
          retention-days: 14

  package-windows:
    needs:
      - sync
      - package-common
    uses: ./.github/workflows/windows-package.yml

  package-macos:
    needs:
      - sync
      - package-common
    uses: ./.github/workflows/macos-package.yml

  publish-desktop:
    needs:
      - package-windows
      - package-macos
    if: "github.event_name == 'push' && github.event.head_commit.message == 'release: publish desktop v0.8.0'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4
        with:
          ref: codex/world-tour-v1

      - name: Download Windows candidate
        uses: actions/download-artifact@v4
        with:
          name: Groove-Bound-Windows-x64
          path: release-assets/windows

      - name: Download macOS candidate
        uses: actions/download-artifact@v4
        with:
          name: Groove-Bound-macOS
          path: release-assets/macos

      - name: Verify payload parity and render release notes
        run: |
          python3 groove-bound/scripts/render_desktop_release.py \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --assets-dir release-assets \
            --template groove-bound/packaging/release-v0.8.0.md \
            --notes-output release-assets/RELEASE-NOTES.md \
            --sums-output release-assets/SHA256SUMS-Desktop.txt

      - name: Publish synchronized desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${RELEASE_VERSION}" \
            release-assets/windows/Groove-Bound-Windows-x64.zip \
            release-assets/windows/Groove-Bound-Windows-x64.manifest.json \
            release-assets/windows/SHA256SUMS-Windows.txt \
            release-assets/macos/Groove-Bound-macOS.dmg \
            release-assets/macos/Groove-Bound-macOS.zip \
            release-assets/macos/groove-bound.love \
            release-assets/SHA256SUMS-Desktop.txt \
            --clobber
          gh release edit "v${RELEASE_VERSION}" \
            --title "Groove Bound v${RELEASE_VERSION}" \
            --notes-file release-assets/RELEASE-NOTES.md

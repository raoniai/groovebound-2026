name: Build and publish desktop release

on:
  push:
    branches:
      - codex/world-overhaul-v090
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  CANONICAL_BRANCH: codex/world-overhaul-v090

jobs:
  sync:
    if: github.repository == 'raoniai/groovebound-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out canonical release source
        uses: actions/checkout@v4
        with:
          ref: codex/world-overhaul-v090
          fetch-depth: 0

      - name: Install regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit lua-check love xvfb

      - name: Verify canonical source
        working-directory: groove-bound
        run: |
          make test
          make lint
          xvfb-run -a env GROOVE_BOUND_SMOKE=1 love .

      - name: Audit desktop portability
        run: |
          python3 skills/groove-bound-desktop-distribution/scripts/portability_audit.py --root .
          git diff --check HEAD^..HEAD

  package-common:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out canonical source
        uses: actions/checkout@v4
        with:
          ref: codex/world-overhaul-v090

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load canonical version
        run: echo "RELEASE_VERSION=$(tr -d '[:space:]' < groove-bound/VERSION)" >> "$GITHUB_ENV"

      - name: Build and verify the common payload once
        working-directory: groove-bound
        run: |
          python scripts/package_love.py --require-clean
          python scripts/verify_release_package.py dist/groove-bound.love

      - name: Enforce source and common-payload version parity
        run: python3 skills/groove-bound-version-sync/scripts/check_version_sync.py --root . --scope local

      - name: Upload common payload
        uses: actions/upload-artifact@v4
        with:
          name: Groove-Bound-common
          path: groove-bound/dist/groove-bound.love
          if-no-files-found: error
          retention-days: 14

  package-windows:
    needs:
      - sync
      - package-common
    uses: ./.github/workflows/windows-package.yml

  package-macos:
    needs:
      - sync
      - package-common
    uses: ./.github/workflows/macos-package.yml

  publish-desktop:
    needs:
      - package-windows
      - package-macos
    if: "github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: publish desktop v')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4
        with:
          ref: codex/world-overhaul-v090

      - name: Load canonical version
        run: echo "RELEASE_VERSION=$(tr -d '[:space:]' < groove-bound/VERSION)" >> "$GITHUB_ENV"

      - name: Download Windows candidate
        uses: actions/download-artifact@v4
        with:
          name: Groove-Bound-Windows-x64
          path: release-assets/windows

      - name: Download macOS candidate
        uses: actions/download-artifact@v4
        with:
          name: Groove-Bound-macOS
          path: release-assets/macos

      - name: Verify payload parity and render release notes
        run: |
          python3 groove-bound/scripts/render_desktop_release.py \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --assets-dir release-assets \
            --template "groove-bound/packaging/release-v${RELEASE_VERSION}.md" \
            --notes-output release-assets/RELEASE-NOTES.md \
            --sums-output release-assets/SHA256SUMS-Desktop.txt

      - name: Enforce complete candidate version and payload parity
        run: |
          python3 skills/groove-bound-version-sync/scripts/check_version_sync.py \
            --root . --scope candidate --assets-dir release-assets

      - name: Publish synchronized desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            gh release create "v${RELEASE_VERSION}" \
              --target "$GITHUB_SHA" \
              --title "Groove Bound v${RELEASE_VERSION}" \
              --notes-file release-assets/RELEASE-NOTES.md \
              --draft
          fi
          gh release upload "v${RELEASE_VERSION}" \
            release-assets/windows/Groove-Bound-Windows-x64.zip \
            release-assets/windows/Groove-Bound-Windows-x64.manifest.json \
            release-assets/windows/SHA256SUMS-Windows.txt \
            release-assets/macos/Groove-Bound-macOS.dmg \
            release-assets/macos/Groove-Bound-macOS.zip \
            release-assets/macos/groove-bound.love \
            release-assets/SHA256SUMS-Desktop.txt \
            --clobber
          gh release edit "v${RELEASE_VERSION}" \
            --title "Groove Bound v${RELEASE_VERSION}" \
            --notes-file release-assets/RELEASE-NOTES.md \
            --draft=false \
            --latest

      - name: Verify GitHub Latest after publication
        run: python3 skills/groove-bound-version-sync/scripts/check_version_sync.py --root . --scope github

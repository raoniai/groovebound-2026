name: Windows x64 package

on:
  push:
    branches:
      - codex/world-tour-v1
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: 0.8.2
  LOVE_RUNTIME_URL: https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip
  LOVE_RUNTIME_SHA256: ba6e56be2685e53c817749c4a5007f51137136fe5a3ab64920508babc2e74369
  RCEDIT_URL: https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
  RCEDIT_SHA256: 3e7801db1a5edbec91b49a24a094aad776cb4515488ea5a4ca2289c400eade2a

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out synchronized source
        uses: actions/checkout@v4
        with:
          ref: codex/world-tour-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download shared common payload
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Groove-Bound-common
          path: groove-bound/dist

      - name: Set up native compiler tools
        uses: step-security/msvc-dev-cmd@v1

      - name: Build native LuaJIT
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: luajit-2.1

      - name: Run the regression suite on Windows
        working-directory: groove-bound
        shell: powershell
        run: |
          lua -v
          lua tests/run.lua

      - name: Download pinned packaging tools
        shell: powershell
        run: |
          Invoke-WebRequest -Uri $env:LOVE_RUNTIME_URL -OutFile love-runtime.zip
          Invoke-WebRequest -Uri $env:RCEDIT_URL -OutFile rcedit-x64.exe
          if ((Get-FileHash love-runtime.zip -Algorithm SHA256).Hash.ToLower() -ne $env:LOVE_RUNTIME_SHA256) {
            throw "LÖVE runtime checksum mismatch"
          }
          if ((Get-FileHash rcedit-x64.exe -Algorithm SHA256).Hash.ToLower() -ne $env:RCEDIT_SHA256) {
            throw "rcedit checksum mismatch"
          }
          Expand-Archive love-runtime.zip -DestinationPath love-runtime

      - name: Build deterministic common payload
        working-directory: groove-bound
        shell: powershell
        run: |
          if (-not (Test-Path "dist\groove-bound.love")) {
            python scripts/package_love.py --version $env:RELEASE_VERSION --require-clean
          }

      - name: Verify common payload
        working-directory: groove-bound
        shell: powershell
        run: python scripts/verify_release_package.py dist/groove-bound.love

      - name: Build branded Windows x64 ZIP
        working-directory: groove-bound
        shell: powershell
        run: |
          python scripts/build_windows_release.py `
            --version $env:RELEASE_VERSION `
            --runtime-dir ..\love-runtime\love-11.5-win64 `
            --resource-editor ..\rcedit-x64.exe `
            --require-branding

      - name: Verify executable metadata and manifest
        working-directory: groove-bound
        shell: powershell
        run: |
          $exe = Get-Item "dist\windows-build\Groove Bound\Groove Bound.exe"
          if ($exe.VersionInfo.ProductName -ne "Groove Bound") { throw "ProductName metadata missing" }
          if ($exe.VersionInfo.FileDescription -ne "Groove Bound") { throw "FileDescription metadata missing" }
          $manifest = Get-Content "dist\Groove-Bound-Windows-x64.manifest.json" | ConvertFrom-Json
          if ($manifest.executable.branding -ne "icon_and_version_metadata") { throw "branding not verified" }
          if ($manifest.executable.signing -ne "unsigned") { throw "unexpected signing state" }
          Expand-Archive "dist\Groove-Bound-Windows-x64.zip" -DestinationPath "dist\unpacked"

      - name: Run packaged Windows bootstrap smoke
        working-directory: groove-bound
        shell: powershell
        run: |
          $smokeRoot = Join-Path $PWD "dist\smoke-appdata"
          $smokeDir = Resolve-Path "dist\unpacked\Groove Bound"
          $marker = Join-Path $smokeDir "groove-bound-smoke-ok.txt"
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          $env:APPDATA = $smokeRoot
          $env:GROOVE_BOUND_SMOKE = "1"
          $env:GROOVE_BOUND_SMOKE_MARKER = "1"
          $process = Start-Process `
            -FilePath (Join-Path $smokeDir "Groove Bound.exe") `
            -WorkingDirectory $smokeDir `
            -ArgumentList "groove-bound-headless-smoke groove-bound-smoke-marker" `
            -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $marker) -and -not $process.HasExited) {
            Start-Sleep -Seconds 1
            $process.Refresh()
          }
          if (-not (Test-Path $marker)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "packaged Windows boot did not reach the validated boot marker"
          }
          if ((Get-Content $marker -Raw).Trim() -ne "boot-complete") {
            throw "packaged Windows boot marker is invalid"
          }
          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force
          }

      - name: Upload Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: Groove-Bound-Windows-x64
          path: |
            groove-bound/dist/Groove-Bound-Windows-x64.zip
            groove-bound/dist/Groove-Bound-Windows-x64.manifest.json
            groove-bound/dist/SHA256SUMS-Windows.txt
          if-no-files-found: error
          retention-days: 14
